name: test

on:
  # Every branch, and no tags. A bare `push` matches tag refs too, so
  # `--follow-tags` at a release built the commit a second time over a tree
  # that had just passed; naming branches at all excludes tags, and `**`
  # keeps every branch building rather than only the default one.
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      - name: Test
        run: nix develop -c zig build test --summary all

      - name: Build
        run: nix develop -c zig build
